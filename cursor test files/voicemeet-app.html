<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frenzone Voice Chat - Space-X Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Landing Screen */
        .landing-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .landing-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            color: #333;
        }

        .landing-card h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #667eea;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        /* Voice Chat Room */
        .voice-chat-room {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .room-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-info h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .room-info p {
            opacity: 0.9;
            font-size: 14px;
        }

        .room-actions {
            display: flex;
            gap: 10px;
        }

        .room-actions .btn {
            width: auto;
            padding: 10px 20px;
            font-size: 14px;
        }

        .members-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .member-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
        }

        .member-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .member-card.host {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .member-card.speaker {
            border-color: #4caf50;
        }

        .member-card.listener {
            border-color: #2196f3;
        }

        .member-card.muted {
            opacity: 0.6;
        }

        .member-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .member-name {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .member-role {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 10px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: inline-block;
        }

        .member-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
        }

        .member-actions button {
            padding: 6px 12px;
            font-size: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: background 0.3s;
        }

        .member-actions button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .member-actions button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Speaking Requests */
        .speaking-requests {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .speaking-requests.has-requests {
            display: block;
        }

        .speaking-requests h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .request-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .request-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .request-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .request-actions {
            display: flex;
            gap: 10px;
        }

        /* Controls Panel */
        .controls-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls-panel button {
            padding: 12px 20px;
            font-size: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: all 0.3s;
        }

        .controls-panel button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .controls-panel button.active {
            background: #4caf50;
        }

        .controls-panel button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Emoji Picker */
        .emoji-picker {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .emoji-picker.show {
            display: block;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .emoji-btn {
            font-size: 24px;
            padding: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .emoji-btn:hover {
            background: #f0f0f0;
        }

        /* Status Messages */
        .status-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            z-index: 2000;
            max-width: 300px;
        }

        .status-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .status-message.success {
            background: rgba(76, 175, 80, 0.9);
        }

        .status-message.error {
            background: rgba(244, 67, 54, 0.9);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .members-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .controls-panel {
                flex-direction: column;
            }

            .controls-panel button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Landing Screen -->
    <div class="landing-screen" id="landingScreen">
        <div class="landing-card">
            <h1>🎤 Voice Chat Room</h1>
            
            <div class="input-group">
                <label>Access Token (Bearer Token)</label>
                <input type="text" id="accessTokenInput" placeholder="Enter your access token">
            </div>

            <div class="input-group">
                <label>User ID</label>
                <input type="text" id="userIdInput" placeholder="Enter your User ID">
            </div>

            <div class="input-group">
                <label>Club ID</label>
                <input type="text" id="clubIdInput" placeholder="Enter Club ID">
            </div>

            <button class="btn btn-success" onclick="createVoiceMeet()">Create New Voice Chat</button>

            <div class="divider">OR</div>

            <div class="input-group">
                <label>VoiceMeet ID (to join existing)</label>
                <input type="text" id="voicemeetIdInput" placeholder="Enter VoiceMeet ID to join">
            </div>

            <button class="btn" onclick="joinVoiceMeet()">Join Existing Voice Chat</button>
        </div>
    </div>

    <!-- Voice Chat Room -->
    <div class="voice-chat-room" id="voiceChatRoom">
        <div class="room-header">
            <div class="room-info">
                <h2 id="roomTitle">Voice Chat Room</h2>
                <p id="roomStatus">Connected</p>
            </div>
            <div class="room-actions">
                <button class="btn btn-danger" onclick="leaveVoiceChat()">Leave Room</button>
                <button class="btn btn-danger" id="endRoomBtn" onclick="endVoiceChat()" style="display: none;">End Room</button>
            </div>
        </div>

        <!-- Speaking Requests (for Host/Moderator/Co-Host) -->
        <div class="speaking-requests" id="speakingRequests">
            <h3>📢 Speaking Requests</h3>
            <div id="requestsList"></div>
        </div>

        <!-- Members Grid -->
        <div class="members-container" id="membersContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading members...</p>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel" id="controlsPanel">
            <button id="requestSpeakBtn" onclick="requestToSpeak()">Request to Speak</button>
            <button id="reactEmojiBtn" onclick="showEmojiPicker()">React</button>
            <button id="shareRoomBtn" onclick="shareRoom()">Share Room</button>
            <button id="reportUserBtn" onclick="showReportDialog()">Report</button>
        </div>

        <!-- Emoji Picker -->
        <div class="emoji-picker" id="emojiPicker">
            <h3>Choose an Emoji</h3>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
                <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
                <button class="emoji-btn" onclick="sendEmoji('❤️')">❤️</button>
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('🎉')">🎉</button>
                <button class="emoji-btn" onclick="sendEmoji('😄')">😄</button>
                <button class="emoji-btn" onclick="sendEmoji('💯')">💯</button>
                <button class="emoji-btn" onclick="sendEmoji('✨')">✨</button>
            </div>
            <button class="btn" onclick="hideEmojiPicker()" style="margin-top: 15px;">Close</button>
        </div>
    </div>

    <!-- Status Message -->
    <div class="status-message" id="statusMessage"></div>

    <script>
        const BASE_URL = 'http://ec2-44-206-194-217.compute-1.amazonaws.com:4000';
        let socket = null;
        let currentUser = {
            userid: '',
            clubid: '',
            voicemeetid: '',
            role: 'listener', // host, cohost, moderator, speaker, listener
            isHost: false,
            isCoHost: false,
            isModerator: false,
            isSpeaker: false
        };
        let members = [];
        let speakingRequests = [];
        let accessToken = '';

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('voicemeet_access_token');
            if (savedToken) {
                document.getElementById('accessTokenInput').value = savedToken;
                accessToken = savedToken;
            }
        });

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type} show`;
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 3000);
        }

        function getAccessToken() {
            const token = document.getElementById('accessTokenInput').value.trim();
            if (token) {
                accessToken = token;
                localStorage.setItem('voicemeet_access_token', token);
                return token;
            }
            return accessToken || localStorage.getItem('voicemeet_access_token') || '';
        }

        async function makeRequest(method, endpoint, body = null) {
            const token = getAccessToken();
            if (!token) {
                showStatus('Access token is required', 'error');
                throw new Error('Access token required');
            }

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                'ngrok-skip-browser-warning': 'true'
            };

            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);

            try {
                const response = await fetch(`${BASE_URL}${endpoint}`, options);
                const data = await response.json();

                if (response.ok) {
                    return data;
                } else {
                    throw new Error(data.error || data.message || 'Unknown error');
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                throw error;
            }
        }

        function connectSocket(userId) {
            if (socket) {
                socket.disconnect();
            }

            socket = io(BASE_URL, {
                auth: { userid: userId }
            });

            socket.on('connect', () => {
                showStatus('Socket connected', 'success');
            });

            socket.on('disconnect', () => {
                showStatus('Socket disconnected', 'error');
            });

            // Listen to all socket events
            socket.on('newUserJoined', (data) => {
                showStatus(`${data.username} joined the room`, 'success');
                loadMembers();
            });

            socket.on('memberCount', (data) => {
                // Update member count if needed
            });

            socket.on('speakingRequest', (data) => {
                showStatus(`${data.requester.username} requested to speak`, 'info');
                loadSpeakingRequests();
            });

            socket.on('speakingRequestApproved', (data) => {
                showStatus(`${data.requester.username} can now speak`, 'success');
                // If it's the current user, update their role
                if (data.requesterid === currentUser.userid) {
                    currentUser.isSpeaker = true;
                    currentUser.role = 'speaker';
                }
                loadSpeakingRequests();
                loadMembers();
            });

            socket.on('speakingRequestDenied', (data) => {
                showStatus(`${data.requester.username}'s request was denied`, 'info');
                loadSpeakingRequests();
            });

            socket.on('userMuted', (data) => {
                showStatus(`${data.targetUser.username} was muted`, 'info');
                loadMembers();
            });

            socket.on('userUnmuted', (data) => {
                showStatus(`${data.targetUser.username} was unmuted`, 'success');
                loadMembers();
            });

            socket.on('coHostAssigned', (data) => {
                showStatus(`${data.targetUser.username} is now a co-host`, 'success');
                loadMembers();
            });

            socket.on('moderatorAssigned', (data) => {
                showStatus(`${data.targetUser.username} is now a moderator`, 'success');
                loadMembers();
            });

            socket.on('movedToListener', (data) => {
                showStatus(`${data.targetUser.username} moved to listener`, 'info');
                loadMembers();
            });

            socket.on('removedFromSpace', (data) => {
                showStatus(`${data.targetUser.username} was removed`, 'info');
                loadMembers();
            });

            socket.on('userBanned', (data) => {
                showStatus(`${data.targetUser.username} was banned`, 'error');
                loadMembers();
            });

            socket.on('emojiReaction', (data) => {
                // Show emoji reaction animation
                showStatus(`${data.username} reacted: ${data.emoji}`, 'info');
            });

            socket.on('voiceChatEnded', (data) => {
                showStatus('Voice chat ended', 'error');
                setTimeout(() => {
                    location.reload();
                }, 2000);
            });

            socket.on('userKicked', (data) => {
                showStatus(`${data.username} was kicked`, 'info');
                loadMembers();
            });

            socket.on('streamended', (data) => {
                showStatus('Stream ended', 'error');
                setTimeout(() => {
                    location.reload();
                }, 2000);
            });
        }

        async function createVoiceMeet() {
            const userid = document.getElementById('userIdInput').value.trim();
            const clubid = document.getElementById('clubIdInput').value.trim();
            const token = getAccessToken();

            if (!token) {
                showStatus('Please enter access token', 'error');
                return;
            }

            if (!userid || !clubid) {
                showStatus('Please enter User ID and Club ID', 'error');
                return;
            }

            try {
                showStatus('Creating voice chat...', 'info');
                const members = prompt('Enter member IDs (comma-separated, or leave empty):');
                const membersArray = members ? members.split(',').map(m => m.trim()) : [];

                const data = await makeRequest('POST', '/voicemeet/createVoiceMeet', {
                    userid,
                    clubid,
                    members: membersArray
                });

                currentUser.userid = userid;
                currentUser.clubid = clubid;
                currentUser.voicemeetid = data._id;
                currentUser.isHost = true;
                currentUser.isSpeaker = true;
                currentUser.role = 'host';

                connectSocket(userid);
                showStatus('Voice chat created!', 'success');
                enterRoom();
                
                // Auto-refresh members and requests periodically
                setInterval(() => {
                    if (currentUser.voicemeetid) {
                        loadMembers();
                        loadSpeakingRequests();
                    }
                }, 5000); // Refresh every 5 seconds
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function joinVoiceMeet() {
            const userid = document.getElementById('userIdInput').value.trim();
            const clubid = document.getElementById('clubIdInput').value.trim();
            const voicemeetid = document.getElementById('voicemeetIdInput').value.trim();
            const token = getAccessToken();

            if (!token) {
                showStatus('Please enter access token', 'error');
                return;
            }

            if (!userid || !voicemeetid) {
                showStatus('Please enter User ID and VoiceMeet ID', 'error');
                return;
            }

            try {
                showStatus('Joining voice chat...', 'info');
                const data = await makeRequest('PATCH', '/voicemeet/joinStream', {
                    userid,
                    streamid: voicemeetid
                });

                currentUser.userid = userid;
                currentUser.clubid = clubid || '';
                currentUser.voicemeetid = voicemeetid;
                currentUser.role = 'listener';
                currentUser.isSpeaker = false;

                connectSocket(userid);
                showStatus('Joined voice chat!', 'success');
                enterRoom();
                
                // Auto-refresh members and requests periodically
                setInterval(() => {
                    if (currentUser.voicemeetid) {
                        loadMembers();
                        loadSpeakingRequests();
                    }
                }, 5000); // Refresh every 5 seconds
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        function enterRoom() {
            document.getElementById('landingScreen').style.display = 'none';
            document.getElementById('voiceChatRoom').style.display = 'block';
            loadMembers();
            loadSpeakingRequests();
            updateControls();
        }

        async function loadMembers() {
            try {
                const data = await makeRequest('GET', `/voicemeet/getViewers/${currentUser.voicemeetid}`);
                members = data.members || [];

                // Also get moderators to check co-host status
                let moderatorsData = [];
                try {
                    const modData = await makeRequest('GET', `/voicemeet/getModerators/${currentUser.voicemeetid}`);
                    moderatorsData = modData.moderators || [];
                } catch (e) {
                    // Ignore if not authorized
                }

                const container = document.getElementById('membersContainer');
                container.innerHTML = '';

                members.forEach(member => {
                    const isHost = member.isHost;
                    const isModerator = member.isModerator;
                    const isCoHost = moderatorsData.some(m => m._id && m._id.toString() === member._id.toString());
                    const isCurrentUser = member._id && member._id.toString() === currentUser.userid;

                    // Update current user role
                    if (isCurrentUser) {
                        if (isHost) {
                            currentUser.isHost = true;
                            currentUser.role = 'host';
                        } else if (isCoHost) {
                            currentUser.isCoHost = true;
                            currentUser.role = 'cohost';
                        } else if (isModerator) {
                            currentUser.isModerator = true;
                            currentUser.role = 'moderator';
                        } else {
                            // Check if speaker (would need additional API call, defaulting to listener for now)
                            currentUser.role = 'listener';
                        }
                    }

                    const card = document.createElement('div');
                    let cardClass = 'member-card ';
                    let roleText = '';
                    
                    if (isHost) {
                        cardClass += 'host';
                        roleText = '👑 Host';
                    } else if (isCoHost) {
                        cardClass += 'speaker';
                        roleText = '⭐ Co-Host';
                    } else if (isModerator) {
                        cardClass += 'speaker';
                        roleText = '🛡️ Moderator';
                    } else {
                        cardClass += 'listener';
                        roleText = '👤 Listener';
                    }
                    
                    card.className = cardClass;

                    const profilePic = member.profilePic || member.profilePicture || 'https://via.placeholder.com/80';

                    card.innerHTML = `
                        <img src="${profilePic}" alt="${member.username}" class="member-avatar" onerror="this.src='https://via.placeholder.com/80'">
                        <div class="member-name">${member.username}${isCurrentUser ? ' (You)' : ''}</div>
                        <div class="member-role">${roleText}</div>
                        <div class="member-actions" id="actions-${member._id}"></div>
                    `;

                    // Add action buttons based on permissions
                    const actionsDiv = card.querySelector(`#actions-${member._id}`);
                    if (!isCurrentUser) {
                        if (currentUser.isHost || currentUser.isModerator || currentUser.isCoHost) {
                            actionsDiv.innerHTML += `
                                <button onclick="muteUser('${member._id}')">Mute</button>
                                <button onclick="unmuteUser('${member._id}')">Unmute</button>
                                <button onclick="moveToListener('${member._id}')">Move to Listener</button>
                                <button onclick="removeFromSpace('${member._id}')">Remove</button>
                                <button onclick="banUser('${member._id}')">Ban</button>
                            `;
                        }
                        if (currentUser.isHost) {
                            actionsDiv.innerHTML += `
                                <button onclick="assignCoHost('${member._id}')">Make Co-Host</button>
                            `;
                        }
                        if (currentUser.isHost || currentUser.isCoHost) {
                            actionsDiv.innerHTML += `
                                <button onclick="assignModerator('${member._id}')">Make Moderator</button>
                            `;
                        }
                    }

                    container.appendChild(card);
                });

                updateControls();
            } catch (error) {
                showStatus(`Error loading members: ${error.message}`, 'error');
            }
        }

        async function loadSpeakingRequests() {
            if (!currentUser.isHost && !currentUser.isModerator && !currentUser.isCoHost) {
                return;
            }

            try {
                const data = await makeRequest('GET', `/voicemeet/getSpeakingRequests/${currentUser.userid}?voicemeetid=${currentUser.voicemeetid}`);
                speakingRequests = data.requests || [];

                const container = document.getElementById('speakingRequests');
                const list = document.getElementById('requestsList');

                if (speakingRequests.length > 0) {
                    container.classList.add('has-requests');
                    list.innerHTML = '';

                    speakingRequests.forEach(request => {
                        const item = document.createElement('div');
                        item.className = 'request-item';
                        item.innerHTML = `
                            <div class="request-user">
                                <img src="${request.profilePicture || 'https://via.placeholder.com/50'}" alt="${request.username}" class="request-avatar" onerror="this.src='https://via.placeholder.com/50'">
                                <div>
                                    <div style="font-weight: 600;">${request.username}</div>
                                    <div style="font-size: 12px; opacity: 0.8;">Requested to speak</div>
                                </div>
                            </div>
                            <div class="request-actions">
                                <button class="btn btn-success" onclick="approveRequest('${request.userid}')" style="padding: 8px 15px; font-size: 12px;">Approve</button>
                                <button class="btn btn-danger" onclick="denyRequest('${request.userid}')" style="padding: 8px 15px; font-size: 12px;">Deny</button>
                            </div>
                        `;
                        list.appendChild(item);
                    });
                } else {
                    container.classList.remove('has-requests');
                }
            } catch (error) {
                // Ignore if not authorized
            }
        }

        function updateControls() {
            const requestSpeakBtn = document.getElementById('requestSpeakBtn');
            const endRoomBtn = document.getElementById('endRoomBtn');

            // Show/hide request to speak button (only for listeners)
            if (currentUser.isHost || currentUser.isCoHost || currentUser.isModerator || currentUser.isSpeaker) {
                requestSpeakBtn.style.display = 'none';
            } else {
                requestSpeakBtn.style.display = 'block';
            }

            // Show/hide end room button (host only)
            if (currentUser.isHost) {
                endRoomBtn.style.display = 'block';
            } else {
                endRoomBtn.style.display = 'none';
            }
        }

        // API Functions
        async function requestToSpeak() {
            try {
                await makeRequest('POST', '/voicemeet/requestToSpeak', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid
                });
                showStatus('Speaking request sent', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function approveRequest(requesterid) {
            try {
                await makeRequest('POST', '/voicemeet/approveSpeakingRequest', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    requesterid
                });
                showStatus('Request approved', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function denyRequest(requesterid) {
            try {
                await makeRequest('POST', '/voicemeet/denySpeakingRequest', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    requesterid
                });
                showStatus('Request denied', 'info');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function muteUser(targetUserid) {
            const muteType = confirm('Hard mute? (User cannot unmute themselves)\n\nOK = Hard mute\nCancel = Soft mute') ? 'hard' : 'soft';
            try {
                await makeRequest('POST', '/voicemeet/muteSpeaker', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    targetUserid,
                    muteType
                });
                showStatus('User muted', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function unmuteUser(targetUserid) {
            try {
                await makeRequest('POST', '/voicemeet/unmuteSpeaker', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    targetUserid
                });
                showStatus('User unmuted', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function moveToListener(targetUserid) {
            try {
                await makeRequest('POST', '/voicemeet/moveToListener', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    targetUserid
                });
                showStatus('User moved to listener', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function removeFromSpace(targetUserid) {
            if (!confirm('Are you sure you want to remove this user?')) return;
            try {
                await makeRequest('POST', '/voicemeet/removeFromSpace', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    targetUserid
                });
                showStatus('User removed', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function banUser(targetUserid) {
            if (!confirm('Are you sure you want to ban this user?')) return;
            try {
                await makeRequest('POST', '/voicemeet/banUser', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    targetUserid
                });
                showStatus('User banned', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function assignCoHost(targetUserid) {
            try {
                await makeRequest('POST', '/voicemeet/assignCoHost', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    targetUserid
                });
                showStatus('Co-host assigned', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function assignModerator(targetUserid) {
            try {
                await makeRequest('POST', '/voicemeet/assignModerator', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    targetUserid
                });
                showStatus('Moderator assigned', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        function showEmojiPicker() {
            document.getElementById('emojiPicker').classList.add('show');
        }

        function hideEmojiPicker() {
            document.getElementById('emojiPicker').classList.remove('show');
        }

        async function sendEmoji(emoji) {
            try {
                await makeRequest('POST', '/voicemeet/reactWithEmoji', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    emoji
                });
                hideEmojiPicker();
                showStatus(`Reacted with ${emoji}`, 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function shareRoom() {
            try {
                const data = await makeRequest('POST', '/voicemeet/shareRoom', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid
                });
                const shareText = `Voice Chat Room\n\nTitle: ${data.shareData.title}\nHost: ${data.shareData.host.username}\nVoiceMeet ID: ${data.shareData.voicemeetid}`;
                if (navigator.share) {
                    navigator.share({ text: shareText });
                } else {
                    navigator.clipboard.writeText(shareText);
                    showStatus('Room info copied to clipboard', 'success');
                }
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        function showReportDialog() {
            const reportedUserid = prompt('Enter User ID to report:');
            if (!reportedUserid) return;

            const reportType = prompt('Report type:\n1. nudity\n2. harassment\n3. hate_speech\n4. scam\n5. underage\n6. spam\n\nEnter number or type:');
            const reason = prompt('Enter reason:');

            if (!reportType || !reason) return;

            const types = ['nudity', 'harassment', 'hate_speech', 'scam', 'underage', 'spam'];
            const type = types[parseInt(reportType) - 1] || reportType;

            reportUser(reportedUserid, reason, type);
        }

        async function reportUser(reportedUserid, reason, reportType) {
            try {
                await makeRequest('POST', '/voicemeet/reportUserInSpace', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid,
                    reportedUserid,
                    reason,
                    reportType
                });
                showStatus('User reported', 'success');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function leaveVoiceChat() {
            if (!confirm('Are you sure you want to leave?')) return;
            try {
                await makeRequest('PATCH', '/voicemeet/leaveVoiceMeet', {
                    userid: currentUser.userid,
                    clubid: currentUser.clubid
                });
                showStatus('Left voice chat', 'info');
                setTimeout(() => location.reload(), 1000);
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function endVoiceChat() {
            if (!confirm('Are you sure you want to end this voice chat? This will disconnect all users.')) return;
            try {
                await makeRequest('POST', '/voicemeet/endVoiceChat', {
                    userid: currentUser.userid,
                    voicemeetid: currentUser.voicemeetid
                });
                showStatus('Voice chat ended', 'info');
                setTimeout(() => location.reload(), 2000);
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
