<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Gif</title>
  </head>
  <body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
    <script>
      const userid = "6669929d5a47b3a0d0e3a0df";
      const streamid = "66c9fd554c4081f890a2343f";    
      const socket = io("http://localhost:4000", {
        auth: {
          userid: userid,
        },
      });

      socket.on("newGift", (data) => {
        var div = document.createElement("div");
        div.innerText = "The id Was: " + data.giftid + "& the price: was" + data.price;
        document.body.appendChild(div);
      });

      socket.on("walletChange", data => {
        console.log(data.balance)
      })
    </script>
  </body>
</html>
