<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Action Stream</title>
  </head>
  <body>
    <button data-action="pause">Pause</button>
    <button data-action="mute">Mute</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
    <script>
      const userid = "664f3a75b5cba769fd3f2df2";
      const streamid = "664f4d44ce5defe8d839e757";
      const socket = io("http://localhost:4000", {
        auth: {
          userid: userid,
        },
      });

      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", (e) => {
          socket.emit("streamActionSend", {
            streamid,
            action: e.target.getAttribute("data-action"),
          });
        });
      });
      socket.on("streamActionReceive", (data) => {
        var div = document.createElement("div");
        div.innerText = "The Action Was: " + JSON.stringify(data);
        document.body.appendChild(div);
      });
    </script>
  </body>
</html>
