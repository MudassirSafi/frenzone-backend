<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Admin side</title>
</head>
<body>
  <button block="0">Block</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
    <script>
        const userid = "664f3a75b5cba769fd3f2df2"
        const blockid = "664f3b1eb5cba769fd3f2e0a"
        const streamid = "664f408c87148883b6116d9b";
        const socket = io("http://localhost:4000", {
            auth: {
                userid: userid
            }
        });

        var button = document.querySelector("button");
        button.addEventListener("click", e=>{
          var block = button.getAttribute("block");
          var data = {
            streamid,
            userid: blockid
          }
          if(block == "0"){
            socket.emit("blockInStream", data)
            button.setAttribute("block", "1")
          }else if(block == "1"){
            socket.emit("unblockInStream", data)
            button.setAttribute("block", "0")
          }
        })

    </script>
</body>
</html>
