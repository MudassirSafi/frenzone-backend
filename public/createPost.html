<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender1</title>
</head>

<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
    <script>
        const senderid = "663f4ac34c2c7d026de687de"
        const socket = io("http://localhost:4000", {
            auth: {
                userid: senderid
            }
        });

        socket.on("connect",()=>{
            console.log("Connected To Server")
        })

        socket.on("disconnect", () => {
            console.log("Disconnected from WebSocket server");
        });

        socket.on("error", (error) => {
            console.error("WebSocket error:", error);
        });
        socket.on("errorCreatingPost", (data) => {
            console.log("errorCreatingPost data:", data);
        });
        socket.on("creatingPost", (data) => {
            console.log("creatingPost data:", data);
        });
        socket.on("createdPost", (data) => {
            console.log("createdPost data:", data);
        });

    </script>
</body>

</html>
