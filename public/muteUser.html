<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Action Stream</title>
  </head>
  <body>
    <button data-id="pause">mute</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
    <script>
      const userid = "66599a5a652e4a389e98ebdb";
      const streamid = "6658830cae13830f8fd68b71";
      const socket = io("http://localhost:4000", {
        auth: {
          userid: userid,
        },
      });

      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", (e) => {
          socket.emit("muteUser", {
            streamid,
            userid,
            muteTime: true
          });
        });
      });
      socket.on("userMute", (data) => {
        var div = document.createElement("div");
        div.innerText = "The Action Was: " + JSON.stringify(data);
        document.body.appendChild(div);
      });
    </script>
  </body>
</html>
